<title>Lautjagd</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
  :root{
    --ink:#14213D; --ink-soft:#3A4A6B;
    --paper:#FFFDF6; --paper-edge:#E8DFC9;
    --desk:#E7DFCD; --desk-deep:#D6CAB0;
    --rule-blue:#3D6BE5; --rule-red:#E5484D;
    --sun:#FFC145; --grass:#2FA84F;
    --shadow:rgba(20,33,61,.18);
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding-block:clamp(14px,3vw,24px); padding-inline:16px;
    background:var(--desk); color:var(--ink);
    font-family:Nunito,system-ui,sans-serif; font-weight:700;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:620px; margin-inline:auto; display:flex; flex-direction:column; gap:clamp(14px,3vw,22px)}

  header{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
  h1{font-family:Fredoka,system-ui,sans-serif; font-weight:600; font-size:clamp(22px,5vw,30px); margin:0}
  h1 .dot{color:var(--rule-red)}
  .stufe{font-size:13px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-soft)}

  /* last ten answers — lets a parent see the 80% band holding */
  .streak{display:flex; gap:5px; justify-content:center; min-height:12px}
  .tick{width:11px; height:11px; border-radius:50%; background:var(--desk-deep)}
  .tick.y{background:var(--grass)} .tick.n{background:var(--rule-red)}

  .listen{
    all:unset; display:grid; place-items:center; justify-self:center; cursor:pointer;
    width:clamp(96px,26vw,128px); aspect-ratio:1; border-radius:50%;
    background:var(--rule-blue); color:#fff;
    box-shadow:0 4px 0 #2B50B4, 0 10px 22px var(--shadow);
    margin-inline:auto;
  }
  .listen:active{transform:translateY(3px); box-shadow:0 1px 0 #2B50B4, 0 6px 14px var(--shadow)}
  .listen svg{width:46%; height:46%; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round}
  .listen.ping{animation:ping 1.1s ease infinite}
  @keyframes ping{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}

  .hint{text-align:center; font-size:15px; color:var(--ink-soft); min-height:1.3em}

  .tiles{display:grid; gap:clamp(9px,2.4vw,14px); grid-template-columns:repeat(var(--cols),minmax(0,1fr))}
  .tile{
    all:unset; display:grid; place-items:center; cursor:pointer;
    aspect-ratio:1; border-radius:16px; background:var(--paper);
    border:2px solid var(--paper-edge);
    font-family:Fredoka,system-ui,sans-serif; font-weight:600;
    font-size:clamp(32px,10vw,58px); line-height:1;
    box-shadow:0 3px 0 var(--paper-edge), 0 7px 16px var(--shadow);
    transition:transform .12s ease;
  }
  .tile:active{transform:translateY(2px)}
  .tile.right{background:#EFFAF2; border-color:var(--grass); color:var(--grass)}
  .tile.wrong{background:#FDF0F0; border-color:var(--rule-red); color:var(--rule-red); animation:shake .34s}
  .tile.show{border-color:var(--grass); box-shadow:0 0 0 4px rgba(47,168,79,.25)}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .tile:focus-visible,.listen:focus-visible,.reset:focus-visible{outline:3px solid var(--ink); outline-offset:3px}

  .start{display:flex; flex-direction:column; align-items:center; gap:14px; padding:clamp(18px,6vw,40px) 0}
  .start p{margin:0; text-align:center; max-width:34ch; color:var(--ink-soft); font-size:16px; line-height:1.5}
  .go{
    font:inherit; font-size:20px; cursor:pointer; border:none; border-radius:999px;
    background:var(--grass); color:#fff; padding:14px 34px; box-shadow:0 3px 0 #1F7D3A;
  }
  .go:active{transform:translateY(2px); box-shadow:0 1px 0 #1F7D3A}

  footer{display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:13px; color:var(--ink-soft)}
  .reset{font:inherit; font-size:13px; cursor:pointer; background:none; border:none; color:var(--ink-soft); text-decoration:underline; padding:4px}
  [hidden]{display:none !important}
  @media (prefers-reduced-motion:reduce){ .listen.ping,.tile.wrong{animation:none} .tile{transition:none} }
</style>

<div class="wrap">
  <header>
    <h1>Lautjagd<span class="dot">.</span></h1>
    <span class="stufe" id="stufe"></span>
  </header>

  <div class="start" id="start">
    <p>Du hörst einen Laut. Tippe auf den Buchstaben, der so klingt.</p>
    <button class="go" id="go">Los geht’s!</button>
  </div>

  <div id="play" hidden>
    <div class="streak" id="streak"></div>
    <button class="listen ping" id="listen" aria-label="Laut noch einmal hören">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z" stroke-linejoin="round"></path>
        <path d="M16 9a4.2 4.2 0 0 1 0 6"></path>
        <path d="M18.8 6.2a8 8 0 0 1 0 11.6"></path>
      </svg>
    </button>
    <p class="hint" id="hint">Nochmal hören</p>
    <div class="tiles" id="tiles"></div>
  </div>

  <footer>
    <span id="tally"></span>
    <button class="reset" id="reset">Von vorne</button>
  </footer>
</div>

/* --- Which letters can be in the pool -------------------------------------
   A sound -> letter task needs exactly one right answer. German breaks that
   for a few letters, so they are excluded rather than made unanswerable:
     V  = /f/ in native words (= F) but /v/ in loanwords (= W)
     C  = /k/ or /ts/ depending on the word (= K or Z)
     Y  = /y/ in Gymnasium, /j/ in Yoga
     ß  = /s/, and S is /s/ or /z/ by position
   ------------------------------------------------------------------------ */
const POOL = ['A','Ä','B','D','E','F','G','H','I','J','K','L','M','N',
              'O','Ö','P','Q','R','S','T','U','Ü','W','X','Z'];

/* Order of introduction: distinct, high-frequency shapes and sounds first,
   confusable ones only once earlier letters are holding. */
const ORDER = ['M','A','S','O','I','T','L','E','N','R','U','F','K','D','B',
               'G','P','H','W','Z','X','J','Q','Ä','Ö','Ü'];

/* Confusable sets — visual shape and acoustic nearness both count.
   These drive the hard distractors, which is where the learning happens. */
const CONFUSE = [
  ['B','D','P','R'], ['E','F'], ['M','N','W'], ['O','Q','G'],
  ['I','J','L','T'], ['U','Ü','W'], ['A','Ä'], ['O','Ö'], ['K','X'],
  ['S','Z'], ['D','T'], ['B','P'], ['G','K'], ['F','W'], ['M','N'],
  ['I','E'], ['U','O'], ['P','Q'], ['N','U'],
];
const nearMap = {};
for(const g of CONFUSE) for(const a of g) for(const b of g)
  if(a !== b) (nearMap[a] ||= new Set()).add(b);
const near = l => [...(nearMap[l] || [])];

const KEY = 'lautjagd.v1';
const WINDOW = 10;          // trials the accuracy is judged over
const TARGET_HI = 0.85;     // above this, make it harder
const TARGET_LO = 0.60;     // below this, make it easier

let S = {
  live: ORDER.slice(0, 3),  // letters currently in play
  cols: 2,                  // 2 -> 6 choices
  tier: 0,                  // 0 distinct distractors, 1 mixed, 2 confusable
  recent: [],               // last WINDOW results
  mastery: {},              // letter -> 0..1
  seen: 0, right: 0, sinceNew: 0,
};
try{ const raw = localStorage.getItem(KEY); if(raw) S = {...S, ...JSON.parse(raw)}; }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

const $ = id => document.getElementById(id);
const audio = new Map();
function play(l){
  const src = SOUNDS[l];
  if(!src) return;
  if(!audio.has(l)){ const a = new Audio(src); a.preload='auto'; audio.set(l,a); }
  const a = audio.get(l);
  try{ a.currentTime = 0; a.play().catch(()=>{}); }catch(e){}
}
const pick = a => a[Math.random()*a.length|0];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

let target = null, locked = false;

function accuracy(){
  if(!S.recent.length) return 1;
  return S.recent.reduce((n,v)=>n+v,0) / S.recent.length;
}

// Keep success near 80%: widen the field, then make distractors confusable,
// then bring in a new letter. Struggling walks the same ladder back down.
function adapt(){
  if(S.recent.length < 6) return;
  const acc = accuracy();
  if(acc >= TARGET_HI){
    if(S.cols < 6) S.cols++;
    else if(S.tier < 2) S.tier++;
    else if(S.live.length < ORDER.length && S.sinceNew >= 5){
      S.live.push(ORDER[S.live.length]); S.sinceNew = 0; S.cols = Math.max(2, S.cols - 1);
    }
    S.recent = [];
  } else if(acc <= TARGET_LO){
    if(S.tier > 0) S.tier--;
    else if(S.cols > 2) S.cols--;
    S.recent = [];
  }
}

function nextTarget(){
  // favour the letters that are least secure, so practice lands where it is needed
  const scored = S.live.map(l => ({l, m: S.mastery[l] ?? 0}));
  scored.sort((a,b) => a.m - b.m);
  const front = scored.slice(0, Math.max(2, Math.ceil(scored.length / 2)));
  return pick(front).l;
}

function distractors(t, n){
  const confusable = near(t).filter(l => S.live.includes(l));
  const plain = S.live.filter(l => l !== t && !confusable.includes(l));
  let want = [];
  if(S.tier === 0)      want = shuffle(plain).concat(shuffle(confusable));
  else if(S.tier === 1) want = shuffle(confusable).slice(0,1).concat(shuffle(plain), shuffle(confusable));
  else                  want = shuffle(confusable).concat(shuffle(plain));
  const out = [];
  for(const l of want){ if(out.length >= n) break; if(!out.includes(l)) out.push(l); }
  // fall back to the whole pool if too few letters are live yet
  for(const l of shuffle(POOL.slice())){
    if(out.length >= n) break;
    if(l !== t && !out.includes(l)) out.push(l);
  }
  return out;
}

function render(){
  $('stufe').textContent = S.live.length + ' Buchstaben · ' + S.cols + ' zur Wahl';
  $('tally').textContent = S.seen ? S.right + ' von ' + S.seen + ' richtig' : '';
  const st = $('streak'); st.innerHTML = '';
  for(let i=0;i<WINDOW;i++){
    const d = document.createElement('span');
    const v = S.recent[S.recent.length - WINDOW + i];
    d.className = 'tick' + (v === 1 ? ' y' : v === 0 ? ' n' : '');
    st.appendChild(d);
  }
}

function trial(){
  locked = false;
  target = nextTarget();
  const opts = shuffle([target, ...distractors(target, S.cols - 1)]);

  const tiles = $('tiles');
  tiles.style.setProperty('--cols', Math.min(opts.length, 3));
  tiles.innerHTML = '';
  opts.forEach(l => {
    const b = document.createElement('button');
    b.className = 'tile';
    b.textContent = l;
    b.setAttribute('aria-label', 'Buchstabe ' + l);
    b.addEventListener('click', () => answer(b, l));
    tiles.appendChild(b);
  });

  $('hint').textContent = 'Nochmal hören';
  $('listen').classList.add('ping');
  render();
  setTimeout(() => play(target), 260);
}

function answer(btn, l){
  if(locked) return;
  locked = true;
  $('listen').classList.remove('ping');
  const ok = l === target;

  S.seen++; if(ok) S.right++;
  S.recent.push(ok ? 1 : 0);
  if(S.recent.length > WINDOW) S.recent.shift();
  S.sinceNew++;
  const m = S.mastery[target] ?? 0;
  S.mastery[target] = m + (ok ? 0.28 : -0.34) * (1 - Math.abs(m - (ok ? 1 : 0)) * 0) ;
  S.mastery[target] = Math.max(0, Math.min(1, S.mastery[target]));

  if(ok){
    btn.classList.add('right');
    $('hint').textContent = 'Richtig!';
    play(target);
  } else {
    btn.classList.add('wrong');
    [...$('tiles').children].forEach(t => { if(t.textContent === target) t.classList.add('show'); });
    $('hint').textContent = 'Das ist ' + target;
    setTimeout(() => play(target), 420);
  }
  adapt(); save(); render();
  setTimeout(trial, ok ? 900 : 1800);
}

$('go').addEventListener('click', () => {
  $('start').hidden = true; $('play').hidden = false;
  trial();
});
$('listen').addEventListener('click', () => { if(target) play(target); });
$('reset').addEventListener('click', () => {
  S = {live: ORDER.slice(0,3), cols:2, tier:0, recent:[], mastery:{}, seen:0, right:0, sinceNew:0};
  save(); $('start').hidden = false; $('play').hidden = true; render();
});
render();
</script>
