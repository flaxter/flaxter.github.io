<title>Buchstaben-Memory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
  :root{
    /* German school-paper palette: Lineatur ruling blue and red, ink navy */
    --ink:#14213D; --ink-soft:#3A4A6B;
    --paper:#FFFDF6; --paper-edge:#EFE7D4;
    --desk:#E7DFCD; --desk-deep:#D8CDB5;
    --rule-blue:#3D6BE5; --rule-red:#E5484D;
    --sun:#FFC145; --grass:#2FA84F;
    --shadow:rgba(20,33,61,.18);
  }
  /* A children's game that commits to one bright schoolroom look on purpose --
     no theme switch, every colour painted explicitly so it holds on any ground. */
  *{box-sizing:border-box}
  body{
    margin:0; padding-block:clamp(14px,3vw,26px); padding-inline:16px;
    background:var(--desk); color:var(--ink);
    font-family:Nunito,system-ui,sans-serif; font-weight:700;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:760px; margin-inline:auto; display:flex; flex-direction:column; gap:clamp(12px,2.4vw,20px)}

  header{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
  h1{
    font-family:Fredoka,system-ui,sans-serif; font-weight:600;
    font-size:clamp(22px,5vw,32px); margin:0; letter-spacing:-.01em; text-wrap:balance;
  }
  h1 .dot{color:var(--rule-red)}

  .levels{display:flex; gap:8px}
  .lvl{
    font:inherit; font-size:15px; cursor:pointer;
    border:2px solid var(--ink); background:var(--paper); color:var(--ink);
    border-radius:999px; padding:7px 15px; line-height:1;
  }
  .lvl[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
  .lvl:focus-visible,.again:focus-visible,.card:focus-visible{outline:3px solid var(--rule-blue); outline-offset:3px}

  .score{display:flex; align-items:center; gap:10px; font-size:17px}
  .pips{display:flex; gap:5px}
  .pip{width:13px; height:13px; border-radius:50%; background:var(--desk-deep); box-shadow:inset 0 0 0 2px rgba(20,33,61,.16)}
  .pip.on{background:var(--sun); box-shadow:inset 0 0 0 2px rgba(20,33,61,.35)}

  .board{
    display:grid; gap:clamp(7px,1.8vw,13px);
    grid-template-columns:repeat(var(--cols),minmax(0,1fr));
  }
  .card{
    all:unset; display:block; position:relative; aspect-ratio:1; cursor:pointer;
    perspective:900px; touch-action:manipulation;
  }
  .face{
    position:absolute; inset:0; border-radius:14px;
    display:grid; place-items:center; backface-visibility:hidden;
    transition:transform .38s cubic-bezier(.3,.8,.4,1);
    box-shadow:0 3px 0 var(--paper-edge), 0 6px 14px var(--shadow);
  }
  /* back = Lineatur, the 4-line ruled paper German first-graders write on */
  .back{
    background:
      repeating-linear-gradient(180deg,
        transparent 0 22%, var(--rule-blue) 22% calc(22% + 1.5px),
        transparent calc(22% + 1.5px) 50%,
        var(--rule-red) 50% calc(50% + 2px),
        transparent calc(50% + 2px) 78%,
        var(--rule-blue) 78% calc(78% + 1.5px),
        transparent calc(78% + 1.5px) 100%),
      var(--paper);
    transform:rotateY(0deg);
  }
  .front{
    background:var(--paper); transform:rotateY(180deg); overflow:hidden;
    border:2px solid var(--paper-edge);
  }
  .card.up .back{transform:rotateY(-180deg)}
  .card.up .front{transform:rotateY(0deg)}

  .glyph{font-family:Fredoka,system-ui,sans-serif; font-weight:600; font-size:clamp(34px,9vw,62px); color:var(--ink); line-height:1}
  .pic{font-size:clamp(30px,8vw,54px); line-height:1}

  /* letters revealed for the child to choose between */
  .card.peek .front{border-color:var(--sun); background:#FFFBF0}
  .card.peek .glyph{color:var(--rule-blue)}
  .card.done .front{border-color:var(--grass); background:#F2FBF4}
  .card.done{animation:pop .42s ease}
  @keyframes pop{40%{transform:scale(1.07)}100%{transform:scale(1)}}
  .card.miss .front{border-color:var(--rule-red)}
  .card.done,.card.matched{cursor:default}

  .say{
    min-height:2.9em; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; text-align:center; background:var(--paper); border-radius:14px;
    padding:10px 14px; box-shadow:0 2px 0 var(--paper-edge);
  }
  .say .de{font-family:Fredoka,system-ui,sans-serif; font-size:clamp(19px,4.4vw,26px); color:var(--ink)}
  .say .en{font-size:13px; font-weight:700; color:var(--ink-soft); letter-spacing:.06em; text-transform:uppercase}
  .say.idle .de{color:var(--ink-soft); font-family:Nunito,system-ui,sans-serif; font-size:16px; font-weight:700}

  .win{display:flex; flex-direction:column; align-items:center; gap:10px; padding:6px 0}
  .win .stars{font-size:clamp(30px,8vw,46px); letter-spacing:.12em}
  .again{
    font:inherit; font-size:19px; cursor:pointer; border:none; border-radius:999px;
    background:var(--grass); color:#fff; padding:13px 30px;
    box-shadow:0 3px 0 #1F7D3A;
  }
  .again:active{transform:translateY(2px); box-shadow:0 1px 0 #1F7D3A}
  [hidden]{display:none !important}

  @media (prefers-reduced-motion:reduce){
    .face{transition-duration:.01ms} .card.done{animation:none}
  }
</style>

<div class="wrap">
  <header>
    <h1>Buchstaben-Memory<span class="dot">.</span></h1>
    <div class="levels" role="group" aria-label="Wie viele Paare">
      <button class="lvl" data-n="3" aria-pressed="false">3</button>
      <button class="lvl" data-n="6" aria-pressed="true">6</button>
      <button class="lvl" data-n="8" aria-pressed="false">8</button>
    </div>
  </header>

  <div class="score">
    <span class="pips" id="pips" aria-label="Gefundene Paare"></span>
  </div>

  <div class="board" id="board"></div>

  <div class="say idle" id="say" aria-live="polite"><span class="de">Tippe auf eine Karte</span></div>

  <div class="win" id="win" hidden>
    <div class="stars">⭐️⭐️⭐️</div>
    <button class="again" id="again">Nochmal!</button>
  </div>
</div>

const board = document.getElementById('board');
const pips  = document.getElementById('pips');
const say   = document.getElementById('say');
const win   = document.getElementById('win');

let cards = [], open = [], found = 0, pairs = 6, busy = false;

// One Audio per clip, reused: creating them per tap stutters on iOS.
const sounds = new Map();
function snd(src){
  if(!sounds.has(src)){ const a = new Audio(src); a.preload='auto'; sounds.set(src,a); }
  return sounds.get(src);
}
function play(src){
  const a = snd(src);
  try{ a.currentTime = 0; a.play().catch(()=>{}); }catch(e){}
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function tell(de, en){
  say.classList.remove('idle');
  say.innerHTML = '<span class="de"></span>' + (en ? '<span class="en"></span>' : '');
  say.querySelector('.de').textContent = de;
  if(en) say.querySelector('.en').textContent = en;
}

function deal(n){
  pairs = n; found = 0; open = []; busy = false;
  win.hidden = true;
  say.className = 'say idle';
  say.innerHTML = '<span class="de">Tippe auf eine Karte</span>';

  const picked = shuffle(DECK.slice()).slice(0, n);
  cards = shuffle(picked.flatMap(p => ([
    {...p, kind:'letter'},
    {...p, kind:'pic'},
  ])));

  board.style.setProperty('--cols', n <= 3 ? 3 : n <= 6 ? 4 : 4);
  board.innerHTML = '';
  cards.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'card';
    b.dataset.i = i;
    b.setAttribute('aria-label', 'Karte ' + (i+1));
    b.innerHTML =
      '<span class="face back" aria-hidden="true"></span>' +
      '<span class="face front">' +
        (c.kind === 'letter'
          ? '<span class="glyph"></span>'
          : '<span class="pic"></span>') +
      '</span>';
    b.querySelector(c.kind === 'letter' ? '.glyph' : '.pic').textContent =
      c.kind === 'letter' ? c.l : c.e;
    b.addEventListener('click', () => flip(i));
    board.appendChild(b);
  });

  pips.innerHTML = '';
  for(let i=0;i<n;i++){
    const s = document.createElement('span');
    s.className = 'pip';
    pips.appendChild(s);
  }
}

let peeked = [];

// Whichever kind you open, the other kind turns face-up to choose from:
// a picture reveals the letters, a letter reveals the pictures. Neither
// reveal makes a sound, so nothing gives the answer away.
function reveal(kind, except){
  peeked = [];
  cards.forEach((c, j) => {
    if(c.kind !== kind || j === except) return;
    const el = board.children[j];
    if(el.classList.contains('done')) return;
    el.classList.add('up','peek');
    peeked.push(j);
  });
}
function unreveal(){
  peeked.forEach(j => {
    const el = board.children[j];
    el.classList.remove('peek');
    if(!el.classList.contains('done') && !open.includes(j)) el.classList.remove('up');
  });
  peeked = [];
}

function endTurn(a, b, ok){
  if(ok){
    board.children[a].classList.add('done');
    board.children[b].classList.add('done');
    pips.children[found].classList.add('on');
    found++;
    const c = cards[a];
    tell(c.l + '  \u00b7  ' + c.w, c.en);
    play(c.ls);
    open = []; unreveal(); busy = false;
    if(found === pairs){
      setTimeout(() => { win.hidden = false; tell('Super gemacht!', ''); }, 550);
    }
  } else {
    board.children[a].classList.add('miss');
    board.children[b].classList.add('miss');
    setTimeout(() => {
      [a,b].forEach(k => board.children[k].classList.remove('up','miss','peek'));
      open = []; unreveal(); busy = false;
    }, 520);
  }
}

function flip(i){
  if(busy) return;
  const el = board.children[i], c = cards[i];
  if(el.classList.contains('done')) return;
  if(open.includes(i)) return;

  // first card of the turn
  if(open.length === 0){
    el.classList.add('up');
    el.classList.remove('peek');
    open = [i];
    if(c.kind === 'pic'){ play(c.ls); reveal('letter', i); }
    else { reveal('pic', i); }
    tell(c.kind === 'letter' ? c.l : c.w, c.kind === 'letter' ? '' : c.en);
    return;
  }

  // second card — a peeked letter counts as the choice
  const a = open[0], ca = cards[a];
  el.classList.add('up');
  el.classList.remove('peek');
  open.push(i);
  if(c.kind === 'pic' && ca.kind === 'letter') play(c.ls);
  busy = true;

  const ok = ca.l === c.l && ca.kind !== c.kind;
  setTimeout(() => endTurn(a, i, ok), ok ? 380 : 560);
}

document.querySelectorAll('.lvl').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.lvl').forEach(x => x.setAttribute('aria-pressed','false'));
    btn.setAttribute('aria-pressed','true');
    deal(+btn.dataset.n);
  });
});
document.getElementById('again').addEventListener('click', () => deal(pairs));

const start = (s={}) => deal(s.pairs || 6);
window.claude?.hot?.snapshot?.(() => ({pairs}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
